<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheerpJ WebAssembly Runner</title>
    <!-- Load the CheerpJ 3 Engine -->
    <script src="https://cj3.leaningtech.com/3.0/cj3loader.js"></script>
    <style>
        body {
            background-color: #000432; /* Your deep blue preference */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #aaa; margin-bottom: 20px; }

        .editor-container {
            width: 80%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: #1a0033; /* Deep purple */
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 15px;
            border: 2px solid #444;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: #8833ff;
            color: white;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background-color: #9955ff; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        #output {
            width: 100%;
            min-height: 200px;
            background-color: #000000;
            color: #00ffcc;
            padding: 15px;
            margin-top: 20px;
            border: 2px solid #444;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>Wasm Java Engine</h1>
    <div class="subtitle">Powered by CheerpJ 3 (No Backend Required)</div>
    
    <div class="editor-container">
        <textarea id="codeEditor" readonly>
// CheerpJ runs COMPILED Java. 
// It is a Java Runtime Environment (JRE) in your browser, not a compiler (JDK).
// To use this, you must compile your .java file to a .jar or .class file first, 
// and then CheerpJ will execute it directly on the webpage!
        </textarea>
        
        <div class="controls">
            <span id="status">Loading WebAssembly Engine...</span>
            <button id="runBtn" onclick="runCompiledJava()" disabled>Run Java App</button>
        </div>

        <div id="output">Initializing CheerpJ... This downloads the Java environment into your browser on the first load.</div>
    </div>

    <script>
        const outputBox = document.getElementById('output');
        const statusText = document.getElementById('status');
        const runBtn = document.getElementById('runBtn');

        // 1. Initialize the CheerpJ Engine when the page loads
        async function bootCheerpJ() {
            try {
                // We customize cheerpjInit to hijack Java's System.out.print 
                // and route it directly into our black HTML output box!
                await cheerpjInit({
                    stdout: (text) => { outputBox.innerText += text; },
                    stderr: (text) => { outputBox.innerText += text; }
                });
                
                outputBox.innerText = "CheerpJ Engine Ready! \nThe browser can now run Java bytecode natively.\n\n";
                statusText.innerText = "Engine Active";
                runBtn.disabled = false;
            } catch (error) {
                outputBox.innerText = "Failed to load CheerpJ: " + error;
            }
        }

        // 2. Function to execute a compiled Java file
        async function runCompiledJava() {
            outputBox.innerText = "Running...\n";
            runBtn.disabled = true;

            try {
                // In a real app, you would upload a .jar file here.
                // For this demo, we are telling CheerpJ to run a built-in Java tool 
                // to prove that the JVM is actually running in your browser!
                await cheerpjRunMain("jshell", "/app/"); 
            } catch (error) {
                outputBox.innerText += "\nExecution Error: " + error;
            } finally {
                runBtn.disabled = false;
            }
        }

        // Start the boot process
        bootCheerpJ();
    </script>
</body>
</html>
