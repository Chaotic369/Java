<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheerpJ WebAssembly Runner</title>
    <style>
        body {
            background-color: #000432; 
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; text-align: center; }
        .subtitle { font-size: 14px; color: #aaa; margin-bottom: 20px; text-align: center; }

        .editor-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #1a0033;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            border: 2px solid #444;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            background-color: #8833ff;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background-color: #9955ff; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        #output {
            width: 100%;
            min-height: 200px;
            background-color: #000000;
            color: #00ffcc;
            padding: 15px;
            margin-top: 20px;
            border: 2px solid #444;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>Wasm Java Engine</h1>
    <div class="subtitle">Powered by CheerpJ 3 (No Backend Required)</div>
    
    <div class="editor-container">
        <textarea id="codeEditor" readonly>
// CheerpJ runs COMPILED Java. 
// It is a Java Runtime Environment (JRE) in your browser, not a compiler (JDK).
// To use this, you must compile your .java file to a .jar or .class file first, 
// and then CheerpJ will execute it directly on the webpage!
        </textarea>
        
        <div class="controls">
            <span id="status">Waiting for page to load...</span>
            <button id="runBtn" onclick="runCompiledJava()" disabled>Run Java App</button>
        </div>

        <div id="output">Initializing CheerpJ...</div>
    </div>

    <!-- Move the CheerpJ script here so it loads right before we execute our code -->
    <script src="https://cj3.leaningtech.com/3.0/cj3loader.js"></script>

    <script>
        const outputBox = document.getElementById('output');
        const statusText = document.getElementById('status');
        const runBtn = document.getElementById('runBtn');

        // Wait for the entire window and external scripts to load
        window.addEventListener('load', async () => {
            
            // Safety check: Did the code editor block the download?
            if (typeof cheerpjInit === 'undefined') {
                statusText.innerText = "Load Failed";
                outputBox.style.color = "#ff4444";
                outputBox.innerText = "ERROR: The CheerpJ engine could not be downloaded.\n\nSince you are using a mobile code editor, its built-in previewer is likely blocking external scripts. \n\nFix: Save this file and open it directly in a real mobile browser (like Chrome or Brave).";
                return;
            }

            try {
                statusText.innerText = "Loading WebAssembly Engine...";
                
                await cheerpjInit({
                    stdout: (text) => { outputBox.innerText += text; },
                    stderr: (text) => { outputBox.innerText += text; }
                });
                
                outputBox.innerText = "CheerpJ Engine Ready! \nThe browser can now run Java bytecode natively.\n\n";
                statusText.innerText = "Engine Active";
                runBtn.disabled = false;
            } catch (error) {
                outputBox.style.color = "#ff4444";
                outputBox.innerText = "Failed to boot CheerpJ: " + error;
            }
        });

        async function runCompiledJava() {
            outputBox.innerText = "Running built-in Java test...\n\n";
            runBtn.disabled = true;

            try {
                // Running a test tool built into the JVM to prove it works
                await cheerpjRunMain("jshell", "/app/"); 
            } catch (error) {
                outputBox.style.color = "#ff4444";
                outputBox.innerText += "\nExecution Error: " + error;
            } finally {
                runBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
