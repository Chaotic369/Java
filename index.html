<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Web Compiler</title>
    <style>
        body {
            /* Deep blue background */
            background-color: #000432; 
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .editor-container {
            width: 80%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 300px;
            /* Deep purple background for the editor */
            background-color: #1a0033; 
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 15px;
            border: 2px solid #444;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #8833ff;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background-color: #8833ff;
            color: white;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #9955ff;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #output {
            width: 100%;
            min-height: 150px;
            background-color: #000000;
            color: #00ffcc;
            padding: 15px;
            margin-top: 20px;
            border: 2px solid #444;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>Java Web Compiler</h1>
    
    <div class="editor-container">
        <!-- Default Java boilerplate -->
        <textarea id="codeEditor">public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from the web compiler!");
    }
}</textarea>
        
        <div class="controls">
            <button id="runBtn" onclick="runCode()">Run Code</button>
        </div>

        <div id="output">Output will appear here...</div>
    </div>

    <script>
        async function runCode() {
            const code = document.getElementById('codeEditor').value;
            const outputBox = document.getElementById('output');
            const runBtn = document.getElementById('runBtn');

            // Set loading state
            outputBox.innerText = "Compiling and running...";
            runBtn.disabled = true;

            // Using the Piston API to execute code
            const payload = {
                language: "java",
                version: "15.0.2",
                files: [
                    {
                        name: "Main.java",
                        content: code
                    }
                ]
            };

            try {
                const response = await fetch("https://emacs.piston.rs/api/v2/execute", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.compile && result.compile.code !== 0) {
                    // Compilation error
                    outputBox.innerText = "COMPILATION ERROR:\n" + result.compile.output;
                    outputBox.style.color = "#ff4444";
                } else if (result.run) {
                    // Execution output or runtime error
                    outputBox.innerText = result.run.output || "Program finished with no output.";
                    outputBox.style.color = result.run.code === 0 ? "#00ffcc" : "#ff4444";
                } else {
                    outputBox.innerText = "An unknown error occurred.";
                }

            } catch (error) {
                outputBox.innerText = "Network Error: Could not connect to the execution server.\n" + error.message;
                outputBox.style.color = "#ff4444";
            } finally {
                // Restore button state
                runBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
